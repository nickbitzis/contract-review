[project]
name = "contractreview"
version = "1.0.0"
description = "Reviews customer contract paper against a negotiation playbook: finds clauses, extracts terms, flags deviations, drafts redlines, and routes approvals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
contractreview = "contractreview.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
